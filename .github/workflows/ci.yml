name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # 架构边界: 模拟层必须能 headless 运行 (README「架构约定」)
      - name: Boundary — src/sim must not import UI
        run: |
          if grep -rnE "from ['\"][^'\"]*ui/" src/sim --include='*.ts'; then
            echo "::error::src/sim imported a UI module — sim must stay headless"
            exit 1
          fi
          echo "boundary OK"
